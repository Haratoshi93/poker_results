name: Keep Streamlit Awake

on:
  schedule:
    # 毎週月曜日に実行してスリープとActions停止を防止
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v3
      
      - name: Create dummy commit to keep actions and streamlit alive
        run: |
          # 日時をテキストに書き込んでファイルに変更を加える
          echo "Last run: $(date)" > .github/keepalive.txt
          
          # Gitの設定
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # コミットとプッシュ（変更があれば）
          git add .github/keepalive.txt
          git commit -m "chore: keep-alive dummy commit" || exit 0
          git push
